# Fork-only: can the 32-bit Windows core be built at all on a bionic-era host?
# GCC's i686 mingw there is the SJLJ one and rust's std wants DWARF, so this
# tries llvm-mingw instead - it carries its own libunwind, which has the
# symbols rust's std asks for, and mstorsjo publishes an 18.04-hosted build.
name: preflight (windows i686 via llvm-mingw)

on:
  workflow_dispatch:
  push:
    branches:
      - preflight-**

env:
  LLVM_MINGW: llvm-mingw-20230320-msvcrt-ubuntu-18.04-x86_64

jobs:
  llvm-mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch llvm-mingw
        run: |
          curl -sSL -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20230320/${LLVM_MINGW}.tar.xz
          sudo tar xJf /tmp/llvm-mingw.tar.xz -C /opt
          /opt/${LLVM_MINGW}/bin/i686-w64-mingw32-clang --version | head -2
      - name: GNU dlltool from apt - rustc calls <triple>-dlltool for raw-dylib,
        # and llvm-dlltool does not stand in for it
        run: sudo apt-get update -qy && sudo apt-get install -yq binutils-mingw-w64-i686
      - run: rustup target add i686-pc-windows-gnu
      - name: build
        env:
          CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER: /opt/llvm-mingw-20230320-msvcrt-ubuntu-18.04-x86_64/bin/i686-w64-mingw32-clang
        run: cargo build --release --target i686-pc-windows-gnu
      - name: what came out
        run: |
          ls -l target/i686-pc-windows-gnu/release/holani.dll
          file target/i686-pc-windows-gnu/release/holani.dll
          /opt/${LLVM_MINGW}/bin/llvm-strip --strip-unneeded target/i686-pc-windows-gnu/release/holani.dll
          ls -l target/i686-pc-windows-gnu/release/holani.dll
