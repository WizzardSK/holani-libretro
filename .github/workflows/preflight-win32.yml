# Fork-only: libretro-build-windows-i686 fails on the buildbot but not on a
# stock ubuntu runner, so this runs the same three commands on the bases the
# buildbot's rust image could plausibly be, to find which one breaks.
name: preflight (windows i686 across bases)

on:
  workflow_dispatch:
  push:
    branches:
      - preflight-**

jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base: [debian:bookworm, ubuntu:22.04]
    name: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4
      - name: build in ${{ matrix.base }}
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER=i686-w64-mingw32-gcc \
            -e DEBIAN_FRONTEND=noninteractive ${{ matrix.base }} sh -c '
              apt-get update -qy &&
              apt-get install -yq curl build-essential gcc-mingw-w64-i686 clang libclang-dev pkg-config &&
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal &&
              . $HOME/.cargo/env &&
              rustc --version && i686-w64-mingw32-gcc --version | head -1 &&
              rustup target add i686-pc-windows-gnu &&
              cargo build --release --target i686-pc-windows-gnu &&
              ls -l target/i686-pc-windows-gnu/release/holani.dll'
