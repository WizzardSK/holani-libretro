# Fork-only. The buildbot's rust image is Ubuntu bionic; this checks what its
# i686 mingw does with Rust's i686-pc-windows-gnu std.
name: preflight (windows i686 on bionic)

on:
  workflow_dispatch:
  push:
    branches:
      - preflight-**

jobs:
  bionic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bionic, the way the image is
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER=i686-w64-mingw32-gcc \
            -e DEBIAN_FRONTEND=noninteractive ubuntu:18.04 sh -c '
              sed -i s/archive.ubuntu.com/old-releases.ubuntu.com/g /etc/apt/sources.list &&
              sed -i s/security.ubuntu.com/old-releases.ubuntu.com/g /etc/apt/sources.list &&
              apt-get update -qy &&
              apt-get install -yq curl build-essential clang libclang-dev pkg-config gcc-mingw-w64-i686 &&
              echo "=== which exception model ===" &&
              i686-w64-mingw32-gcc -v 2>&1 | tail -2 &&
              (i686-w64-mingw32-gcc-posix -v 2>&1 | tail -2 || echo "no -posix variant") &&
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal &&
              . $HOME/.cargo/env &&
              rustup target add i686-pc-windows-gnu &&
              cargo build --release --target i686-pc-windows-gnu 2>&1 | tail -20'
